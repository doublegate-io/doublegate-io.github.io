name: site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      # svg-routes.js is pure geometry, no browser and no npm deps — but it does
      # need a node runtime in this job.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: '22'

      # the built pages must match what pages/*.html + build.py produce
      - name: built output is not stale
        run: python3 build.py --check

      # tag balance, anchors, cross-page links, assets, vocabulary, metadata,
      # CTAs, alt text, no private-repo links, nav parity, motion paths,
      # sentence fragments, evidence sources
      - name: gate checks
        run: python3 check.py

      # api/ is a snapshot of the code repositories' rendered API documents; here,
      # without those checkouts, the check is shape and self-consistency. The
      # drift check runs where the checkouts sit beside this one (check.py, locally).
      - name: the API snapshot is well-formed
        run: python3 api-sync.py --check

      # Pure path/rect geometry — no browser needed, so it runs in this job rather
      # than behind the browser gate. None of the three browser SVG checks involve
      # a path/rect comparison, so this defect shipped once: separating two crowded
      # branches moved a connector through 78px of a stage box's interior.
      - name: svg connector routing
        run: node svg-routes.js

  # The SVG checks need a real browser to measure rendered text, so they run in
  # their own job. Both tools exit 0 on a SKIP path when no browser is found --
  # that once made a broken check look green for weeks -- so this job asserts the
  # browser exists before trusting either result.
  svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: '22'

      - name: install puppeteer-core
        run: npm ci || npm install

      # svg-scale.js measures figures inside the BUILT pages, so they must exist.
      # build.py is stdlib-only, and ubuntu-latest ships python3.
      - name: build the pages
        run: python3 build.py

      - name: locate a browser
        run: |
          for c in "$CHROME_PATH" /usr/bin/google-chrome /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$c" ]; then echo "CHROME_PATH=$c" >> "$GITHUB_ENV"; echo "using $c"; exit 0; fi
          done
          echo "no browser found — the SVG gates would silently SKIP" >&2
          exit 1

      # text nodes must not collide with each other
      - name: svg text overlap
        run: node svg-geometry.js

      # ...and must not run outside the viewBox, which the overlap check cannot see
      - name: svg text bounds
        run: node svg-bounds.js

      # ...and must still be legible once a page container scales them down, which
      # neither of the above can see: both measure the SVG at its natural size.
      - name: svg label scale in the page
        run: node svg-scale.js

      # ...and must fit the box that contains it. The three checks above compare
      # text to other text, to the viewBox, and to a minimum size — never to its
      # own container, so hero-flow.svg shipped with eleven labels wider than
      # their boxes and the whole suite called it clean.
      - name: svg labels fit their boxes
        run: node svg-fit.js

      # ...and must not be crowded by a line. The five checks above never compare
      # a stroke to a label, so a connector could run 2px under a descender and
      # the whole suite still called the file clean.
      - name: svg label clearance from lines
        run: node svg-clearance.js

      - name: homepage layout and interaction contracts
        run: node overview-check.js
