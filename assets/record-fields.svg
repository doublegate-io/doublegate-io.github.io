<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 545" width="1040" height="545"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif"
     role="img" aria-labelledby="rtitle rdesc">
<title id="rtitle">What one signed record contains, and which requirement each field answers</title>
<desc id="rdesc">A single signed record, field by field. The left column lists what the record holds:
the artifact and its version, the claim itself, where it came from including the source system and
the run that produced it, what the scanners found, who reviewed it and who signed it, the verdict
with its reasons, the timestamp, and a signature over all of the preceding fields. The right column
names the requirement each field answers — ECB lineage traceability, EU AI Act Article 12 event
logging, GDPR Article 30 records of processing, GDPR Article 22 human intervention, and BCBS 239
Principle 3 reconciliation. A rejected artifact produces the same record with a refusal verdict; the
record exists either way, which is what makes it an audit trail rather than a success log.</desc>

<defs>
  <style><![CDATA[
    .zn    { font-size:11.5px; font-weight:700; letter-spacing:.1em; fill:#8d97a9; }
    .fld   { font-size:12.5px; font-weight:650; fill:#e6e9ef; }
    .val   { font-size:12px; fill:#97a1b2; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
    .req   { font-size:11.5px; fill:#a5f3fc; }
    .reqD  { font-size:11.5px; fill:#8d97a9; }
    .note  { font-size:12px; fill:#8d97a9; }
    .row   { fill:#0b0d12; stroke:#1a202b; stroke-width:1.1; }
    .rowA  { fill:#0e1118; stroke:#1e2430; stroke-width:1.1; }
  ]]></style>
  <linearGradient id="sigG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#064e3b" stop-opacity=".6"/><stop offset="1" stop-color="#064e3b" stop-opacity=".18"/>
  </linearGradient>
</defs>

<rect width="1040" height="545" fill="#08090c"/>

<text class="zn" x="24" y="26">ONE SIGNED RECORD — WHAT IT HOLDS, AND WHAT EACH FIELD IS FOR</text>
<text class="zn" x="640" y="26" fill="#22d3ee">THE REQUIREMENT IT ANSWERS</text>
<line x1="24" y1="36" x2="1016" y2="36" stroke="#1e2430" stroke-width="1"/>
<line x1="628" y1="36" x2="628" y2="488" stroke="#1e2430" stroke-width="1"/>

<!-- 1 · artifact -->
<rect class="row" x="24" y="44" width="992" height="44" rx="7"/>
<text class="fld" x="44"  y="62">artifact</text>
<text class="val" x="44"  y="80">memory · v3 · replaces v2</text>
<text class="req" x="648" y="62">Versioned, not edited in place</text>
<text class="reqD" x="648" y="80">a correction is a new version linked to what it replaced</text>

<!-- 2 · the claim -->
<rect class="rowA" x="24" y="92" width="992" height="44" rx="7"/>
<text class="fld" x="44"  y="110">the claim</text>
<text class="val" x="44"  y="128">what is asserted to be true</text>
<text class="req" x="648" y="110">The thing under review</text>
<text class="reqD" x="648" y="128">held in a separate store until this record exists</text>

<!-- 3 · origin -->
<rect class="row" x="24" y="140" width="992" height="60" rx="7"/>
<text class="fld" x="44"  y="158">where it came from</text>
<text class="val" x="44"  y="176">source system · slice · fields in scope</text>
<text class="val" x="44"  y="192">the run that produced it</text>
<text class="req" x="648" y="158">ECB RDARR — lineage</text>
<text class="reqD" x="648" y="176">"track back the source of the issue in a timely manner"</text>
<text class="reqD" x="648" y="192">and "allow traceability for (external) validation"</text>

<!-- 4 · scans -->
<rect class="rowA" x="24" y="204" width="992" height="60" rx="7"/>
<text class="fld" x="44"  y="222">what the scanners found</text>
<text class="val" x="44"  y="240">injection · secrets · executables</text>
<text class="val" x="44"  y="256">every check, pass or fail</text>
<text class="req" x="648" y="222">EU AI Act, Article 12</text>
<text class="reqD" x="648" y="240">"automatic recording of events (logs)</text>
<text class="reqD" x="648" y="256">over the lifetime of the system"</text>

<!-- 5 · who -->
<rect class="row" x="24" y="268" width="992" height="60" rx="7"/>
<text class="fld" x="44"  y="286">who reviewed it</text>
<text class="val" x="44"  y="304">reviewer identity — never the author</text>
<text class="val" x="44"  y="320">the human who signed off, where one did</text>
<text class="req" x="648" y="286">GDPR, Article 22(3)</text>
<text class="reqD" x="648" y="304">the right "to obtain human intervention" and</text>
<text class="reqD" x="648" y="320">"to express his or her point of view"</text>

<!-- 6 · verdict -->
<rect class="rowA" x="24" y="332" width="992" height="44" rx="7"/>
<text class="fld" x="44"  y="350">the verdict, and its reasons</text>
<text class="val" x="44"  y="368">approved · or refused, and why</text>
<text class="req" x="648" y="350">GDPR, Article 30(1)</text>
<text class="reqD" x="648" y="368">"maintain a record of processing activities"</text>

<!-- 7 · when -->
<rect class="row" x="24" y="380" width="992" height="44" rx="7"/>
<text class="fld" x="44"  y="398">when</text>
<text class="val" x="44"  y="416">decided at · valid from</text>
<text class="req" x="648" y="398">BCBS 239, Principle 3</text>
<text class="reqD" x="648" y="416">"a single authoritative source for risk data per each type of risk"</text>

<!-- 8 · the signature over everything above -->
<rect x="24" y="432" width="992" height="56" rx="8" fill="url(#sigG)" stroke="#34d399" stroke-width="1.6"/>
<text class="fld" x="44"  y="452" fill="#d1fae5">signature</text>
<text class="val" x="44"  y="472" fill="#a7f3d0">over every field above — verifiable without asking us</text>
<text class="req" x="648" y="452" fill="#6ee7b7">Why an auditor can check it themselves</text>
<text class="reqD" x="648" y="472">change any field and the signature stops verifying</text>

<text class="note" x="24" y="512">A refusal produces this same record with a refused verdict. The record exists either way — a gate that only files its successes is not an audit trail.</text>
</svg>
