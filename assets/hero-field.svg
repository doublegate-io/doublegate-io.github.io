<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="1080" height="430"
     role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif">
<title id="t">What the gate returns for sixty submitted memories and skills</title>
<desc id="d">Five rows, one per verdict, showing what came back for sixty things agents wrote down. Twenty-three were NEW: nothing like them existed, so each was promoted as its own artifact, readable once signed. Fourteen were SHARPENED: they corrected a skill already held, so a revision superseded the parent and both are kept, drawn as a bright dot with the retained parent dimmer behind it. Eleven were MERGED: several beliefs reconciled into one, with the parents superseded rather than edited or deleted. Eight were HELD: they contradicted something and the merge was refused, so both parents stay live and the contradiction stays visible with its provenance, drawn as two dots of equal weight. Four were REFUSED as injection, a secret, or simply wrong, drawn hollow because they remain in the ledger with their reasons recorded but are never readable by anyone. The counts sum to sixty. Every submission ends in exactly one verdict, carrying a signature naming who decided and on what basis; nothing is edited in place and nothing vanishes. The split across the five verdicts is illustrative of the mechanism, not a measured rate.</desc>
