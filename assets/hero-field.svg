<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="1080" height="430"
     role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif">
<title id="t">What the gate returns for sixty memories and skills agents wrote</title>
<desc id="d">Five rows, one per verdict, showing what came back for sixty things agents wrote down. Twenty-three were NEW: nothing like them existed, so each was promoted as a claim of its own once signed. Fourteen were REVISED: they corrected a skill you already have, so a revision superseded the parent and both are kept, drawn as a bright dot with the retained parent dimmer behind it. Eleven were MERGED: several beliefs reconciled into one, with the parents superseded rather than edited or deleted. Eight were HELD: each contradicted a claim already promoted, so it is held beside that claim, recall returns only the promoted one, and the contradiction stays visible with its provenance, drawn as a pair of dots. Four were REJECTED as injection, a secret, or simply wrong, drawn hollow because they stay in the journal with their reasons recorded and are never promoted. The counts sum to sixty. Every write ends in exactly one outcome, signed in the journal, naming who decided and on what basis; nothing is edited in place and nothing is deleted. The split across the five outcomes is illustrative of the mechanism, not a measured rate.</desc>
