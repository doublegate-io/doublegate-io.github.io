<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 534" width="1000" height="534"
     role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif">
<title id="t">Where an arriving claim goes, and the loop that runs when it meets one already there</title>
<desc id="d">A claim arriving at the gate, and the loop that runs when it meets one already there. On the left, the quarantine: the claim is held here while it is reviewed, and no other agent's recall returns it. It passes five stages in order — WRITE, held in quarantine; SCAN, for injection, secrets and scripts; GRADE, two readings, and a person when policy asks; SIGN, by a reviewer who is not the author; and PROMOTE, a signed journal event marked provisional. Only then does a single arrow cross into the promoted claims, which recall finds. Below the path, one dashed arrow shows what happens when a claim meets one already there: a correction is a new claim that takes the same path, graded and signed again by a reviewer who is not its author. Nothing is edited in place. Four endings are possible: PROMOTED, a new claim recall finds once it is signed; SUPERSEDED, where the correction is served and the old version is kept; MERGED, by reviewers only, with the parents kept; and REJECTED, kept with the reason recorded and never recalled. The figure shows mechanism only — what connects to what and who may not act — and claims no rates, volumes or timings.</desc>
