<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 534" width="1000" height="534"
     role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif">
<title id="t">Where an arriving claim goes, and the loop that runs when it matches one already held</title>
<desc id="d">A claim arriving at the gate, and the loop that runs when it matches something already held. On the left, memory limbo: the claim is held here while it is judged, and no consumer read path reaches this store. It passes through five stages in order — ADMIT, which records the envelope, trust class and any derives_from edges; SCAN, for injection, keys and scripts; ASSESS, an AI trust score from 0–100; DECIDE, a distinct authorized non-author AI or human approves or rejects; and RECORD, a signed event in the ledger. Only then does a single arrow cross into active memory, the only store current access, and one component is its only writer. Below the pipe, one dashed arrow shows what happens when the arriving claim matches one already held: consolidation proposes a new claim carrying edges to every parent, and that candidate takes a second full trip through the same gate, graded by an identity that did not propose it. Nothing is edited in place. Four endings are possible: PROMOTED, a new claim readable once signed; MERGE ACCEPTED, with the parents superseded and kept, never deleted; MERGE REFUSED, where both parents stay live and the store stays contradictory on purpose; and REFUSED, which stays in the ledger with its reasons and is excluded from shared retrieval. The figure shows mechanism only — what connects to what and who may not act — and claims no rates, volumes or timings.</desc>
