<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="mark">
  <title>mark</title>
  <desc>An open book with a stamp struck across it: read only after someone accountable signed it in.</desc>
  <style>
    .ink { fill: #e6e9ef; }
    .ink-s { stroke: #e6e9ef; }
