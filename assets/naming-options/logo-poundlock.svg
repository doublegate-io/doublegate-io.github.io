<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="mark">
  <title>mark</title>
  <desc>A canal pound lock from above: a gate at each end, never both open, with the load held in the chamber between them.</desc>
  <style>
    .ink { fill: #e6e9ef; }
    .ink-s { stroke: #e6e9ef; }
    .cut { stroke: #08090c; }
    @media (prefers-color-scheme: light) {
      .ink { fill: #10131a; }
      .ink-s { stroke: #10131a; }
      .cut { stroke: #ffffff; }
    }
  </style>
  <path d="M3 5.5 v21" stroke="#fb7185" stroke-width="4" stroke-linecap="round"/>
  <path d="M29 5.5 v21" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  <rect x="12" y="11" width="8" height="10" rx="1.6" class="ink"/>
</svg>
