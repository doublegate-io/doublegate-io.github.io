<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="820" height="120" role="img" aria-label="AgentLibrarian">
  <title>AgentLibrarian</title>
  <desc>An open book with a stamp struck across it: read only after someone accountable signed it in.</desc>
  <style>
    .wm { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif; }
    .name { font-size: 54px; font-weight: 650; letter-spacing: -1.2px; fill: #e6e9ef; }
    .tag { font-size: 20px; fill: #97a1b2; }
    .ink { fill: #e6e9ef; }
    .ink-s { stroke: #e6e9ef; }
    .cut { stroke: #08090c; }
    @media (prefers-color-scheme: light) {
      .name { fill: #10131a; }
      .tag { fill: #55606f; }
      .ink { fill: #10131a; }
      .ink-s { stroke: #10131a; }
      .cut { stroke: #ffffff; }
    }
  </style>
  <g transform="translate(14 12) scale(2.0)">
    <path d="M15.1 28 c-2.8 -3 -6.4 -3.4 -9.6 -2.4 v-11.5 c3.2 -1 6.8 -0.6 9.6 2.4 z" class="ink"/>
    <path d="M16.9 28 c2.8 -3 6.4 -3.4 9.6 -2.4 v-11.5 c-3.2 -1 -6.8 -0.6 -9.6 2.4 z" fill="#34d399"/>
    <rect x="16" y="3" width="12" height="9" rx="1.5" fill="none" stroke="#fbbf24" stroke-width="2.6"/>
    <path d="M19 7.5 h6" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text class="wm name" x="112" y="60">AgentLibrarian</text>
  <text class="wm tag"  x="114" y="92">reviewed before it is remembered</text>
</svg>
