<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="820" height="120" role="img" aria-label="adlect.io">
  <title>adlect.io</title>
  <desc>Items on the roll, and one arriving: formal admission by a separate authority, with the name running across the dot.</desc>
  <style>
    .wm { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif; }
    .name { font-size: 54px; font-weight: 650; letter-spacing: -1.2px; fill: #e6e9ef; }
    .tag { font-size: 20px; fill: #97a1b2; }
    .ink { fill: #e6e9ef; }
    .ink-s { stroke: #e6e9ef; }
    .cut { stroke: #08090c; }
    @media (prefers-color-scheme: light) {
      .name { fill: #10131a; }
      .tag { fill: #55606f; }
      .ink { fill: #10131a; }
      .ink-s { stroke: #10131a; }
      .cut { stroke: #ffffff; }
    }
  </style>
  <g transform="translate(14 12) scale(2.0)">
    <path d="M2.5 21.5 h27" stroke="#97a1b2" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="8" cy="21.5" r="3.4" fill="#34d399"/>
    <circle cx="17" cy="21.5" r="3.4" class="ink"/>
    <circle cx="25.5" cy="9" r="3.8" fill="#fb7185"/>
    <path d="M25.5 14 v3.5" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  </g>
  <text class="wm name" x="112" y="60">adlect.io</text>
  <text class="wm tag"  x="114" y="92">reviewed before it is remembered</text>
</svg>
