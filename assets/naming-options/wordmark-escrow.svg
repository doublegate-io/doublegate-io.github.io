<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="820" height="120" role="img" aria-label="KnowledgeEscrow">
  <title>KnowledgeEscrow</title>
  <desc>Two parties bracketing a held artifact neither can reach alone: released only when an independent condition is met.</desc>
  <style>
    .wm { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif; }
    .name { font-size: 54px; font-weight: 650; letter-spacing: -1.2px; fill: #e6e9ef; }
    .tag { font-size: 20px; fill: #97a1b2; }
    .ink { fill: #e6e9ef; }
    .ink-s { stroke: #e6e9ef; }
    .cut { stroke: #08090c; }
    @media (prefers-color-scheme: light) {
      .name { fill: #10131a; }
      .tag { fill: #55606f; }
      .ink { fill: #10131a; }
      .ink-s { stroke: #10131a; }
      .cut { stroke: #ffffff; }
    }
  </style>
  <g transform="translate(14 12) scale(2.0)">
    <path d="M8 5.5 h-4.5 v21 h4.5" fill="none" stroke="#fb7185" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 5.5 h4.5 v21 h-4.5" fill="none" stroke="#34d399" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="12.5" y="12" width="7" height="8" rx="1.5" class="ink"/>
  </g>
  <text class="wm name" x="112" y="60">KnowledgeEscrow</text>
  <text class="wm tag"  x="114" y="92">reviewed before it is remembered</text>
</svg>
