<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="820" height="120" role="img" aria-label="Lectorium">
  <title>Lectorium</title>
  <desc>A lectern with a leaf on it: the reading room, where what has been admitted may be read.</desc>
  <style>
    .wm { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif; }
    .name { font-size: 54px; font-weight: 650; letter-spacing: -1.2px; fill: #e6e9ef; }
    .tag { font-size: 20px; fill: #97a1b2; }
    .ink { fill: #e6e9ef; }
    .ink-s { stroke: #e6e9ef; }
    .cut { stroke: #08090c; }
    @media (prefers-color-scheme: light) {
      .name { fill: #10131a; }
      .tag { fill: #55606f; }
      .ink { fill: #10131a; }
      .ink-s { stroke: #10131a; }
      .cut { stroke: #ffffff; }
    }
  </style>
  <g transform="translate(14 12) scale(2.0)">
    <path d="M16 27 v-6" stroke="#97a1b2" stroke-width="3" stroke-linecap="round"/>
    <path d="M8 27 h16" stroke="#97a1b2" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M4 18.5 l11.5 -4 l11.5 4 l-11.5 4 z" fill="#fb7185"/>
    <path d="M15.5 14.5 v-9" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <path d="M11 7 h9" stroke="#34d399" stroke-width="2.8" stroke-linecap="round"/>
  </g>
  <text class="wm name" x="112" y="60">Lectorium</text>
  <text class="wm tag"  x="114" y="92">reviewed before it is remembered</text>
</svg>
