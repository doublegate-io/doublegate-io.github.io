<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="820" height="120" role="img" aria-label="Correctorium">
  <title>Correctorium</title>
  <desc>Exemplar and copy side by side, the copy carrying the corrector's mark: collated by someone who did not write it.</desc>
  <style>
    .wm { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif; }
    .name { font-size: 54px; font-weight: 650; letter-spacing: -1.2px; fill: #e6e9ef; }
    .tag { font-size: 20px; fill: #97a1b2; }
    .ink { fill: #e6e9ef; }
    .ink-s { stroke: #e6e9ef; }
    .cut { stroke: #08090c; }
    @media (prefers-color-scheme: light) {
      .name { fill: #10131a; }
      .tag { fill: #55606f; }
      .ink { fill: #10131a; }
      .ink-s { stroke: #10131a; }
      .cut { stroke: #ffffff; }
    }
  </style>
  <g transform="translate(14 12) scale(2.0)">
    <rect x="3.5" y="6" width="10" height="20" rx="1.8" fill="none" class="ink-s" stroke-width="2.4"/>
    <rect x="18.5" y="6" width="10" height="20" rx="1.8" fill="none" stroke="#34d399" stroke-width="2.4"/>
    <path d="M20.8 17 l2.6 2.8 l4.6 -6" fill="none" stroke="#fb7185" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="wm name" x="112" y="60">Correctorium</text>
  <text class="wm tag"  x="114" y="92">reviewed before it is remembered</text>
</svg>
