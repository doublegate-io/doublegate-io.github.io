<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="820" height="120" role="img" aria-label="Accession">
  <title>Accession</title>
  <desc>A shelf of accessioned items and one still outside the collection. Admission is the moment it joins the line.</desc>
  <style>
    .wm { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif; }
    .name { font-size: 54px; font-weight: 650; letter-spacing: -1.2px; fill: #e6e9ef; }
    .tag { font-size: 20px; fill: #97a1b2; }
    .ink { fill: #e6e9ef; }
    .ink-s { stroke: #e6e9ef; }
    .cut { stroke: #08090c; }
    @media (prefers-color-scheme: light) {
      .name { fill: #10131a; }
      .tag { fill: #55606f; }
      .ink { fill: #10131a; }
      .ink-s { stroke: #10131a; }
      .cut { stroke: #ffffff; }
    }
  </style>
  <g transform="translate(14 12) scale(2.0)">
    <path d="M3 26.5 h26" stroke="#34d399" stroke-width="2.8" stroke-linecap="round"/>
    <rect x="5" y="8.5" width="5.4" height="15.5" rx="1.3" class="ink"/>
    <rect x="12.2" y="13" width="5.4" height="11" rx="1.3" class="ink"/>
    <rect x="22" y="6" width="5.4" height="14" rx="1.3" fill="#fb7185" transform="rotate(14 24.7 13)"/>
  </g>
  <text class="wm name" x="112" y="60">Accession</text>
  <text class="wm tag"  x="114" y="92">reviewed before it is remembered</text>
</svg>
