<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="820" height="120" role="img" aria-label="Countersigned">
  <title>Countersigned</title>
  <desc>Two signature strokes crossing: a second party validating the first, which is the whole architecture.</desc>
  <style>
    .wm { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif; }
    .name { font-size: 54px; font-weight: 650; letter-spacing: -1.2px; fill: #e6e9ef; }
    .tag { font-size: 20px; fill: #97a1b2; }
    .ink { fill: #e6e9ef; }
    .ink-s { stroke: #e6e9ef; }
    .cut { stroke: #08090c; }
    @media (prefers-color-scheme: light) {
      .name { fill: #10131a; }
      .tag { fill: #55606f; }
      .ink { fill: #10131a; }
      .ink-s { stroke: #10131a; }
      .cut { stroke: #ffffff; }
    }
  </style>
  <g transform="translate(14 12) scale(2.0)">
    <path d="M4 12 c3 -4 5.5 -3.5 7 0 c1.5 3.5 4 4 7.5 -1" fill="none" stroke="#fb7185" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M4 15.5 h24" stroke="#97a1b2" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <path d="M4 24 c3 -4 5.5 -3.5 7 0 c1.5 3.5 4 4 7.5 -1" fill="none" stroke="#34d399" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M4 27.5 h24" stroke="#97a1b2" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  </g>
  <text class="wm name" x="112" y="60">Countersigned</text>
  <text class="wm tag"  x="114" y="92">reviewed before it is remembered</text>
</svg>
