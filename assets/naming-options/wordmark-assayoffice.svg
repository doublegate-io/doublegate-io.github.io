<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="820" height="120" role="img" aria-label="AssayOffice">
  <title>AssayOffice</title>
  <desc>A hallmark struck into a shield: tested by an independent office, and the mark says which one.</desc>
  <style>
    .wm { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif; }
    .name { font-size: 54px; font-weight: 650; letter-spacing: -1.2px; fill: #e6e9ef; }
    .tag { font-size: 20px; fill: #97a1b2; }
    .ink { fill: #e6e9ef; }
    .ink-s { stroke: #e6e9ef; }
    .cut { stroke: #08090c; }
    @media (prefers-color-scheme: light) {
      .name { fill: #10131a; }
      .tag { fill: #55606f; }
      .ink { fill: #10131a; }
      .ink-s { stroke: #10131a; }
      .cut { stroke: #ffffff; }
    }
  </style>
  <g transform="translate(14 12) scale(2.0)">
    <path d="M16 3.5 l12.5 12.5 l-12.5 12.5 l-12.5 -12.5 z" fill="none" stroke="#fb7185" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M11 16 h10" stroke="#34d399" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M13 11 h6" class="ink-s" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M13 21 h6" class="ink-s" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text class="wm name" x="112" y="60">AssayOffice</text>
  <text class="wm tag"  x="114" y="92">reviewed before it is remembered</text>
</svg>
