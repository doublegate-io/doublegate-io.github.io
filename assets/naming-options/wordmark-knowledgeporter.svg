<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="820" height="120" role="img" aria-label="KnowledgePorter">
  <title>KnowledgePorter</title>
  <desc>A porter's lodge hatch: you present what you have at the desk, and the desk decides.</desc>
  <style>
    .wm { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif; }
    .name { font-size: 54px; font-weight: 650; letter-spacing: -1.2px; fill: #e6e9ef; }
    .tag { font-size: 20px; fill: #97a1b2; }
    .ink { fill: #e6e9ef; }
    .ink-s { stroke: #e6e9ef; }
    .cut { stroke: #08090c; }
    @media (prefers-color-scheme: light) {
      .name { fill: #10131a; }
      .tag { fill: #55606f; }
      .ink { fill: #10131a; }
      .ink-s { stroke: #10131a; }
      .cut { stroke: #ffffff; }
    }
  </style>
  <g transform="translate(14 12) scale(2.0)">
    <path d="M5 21 v-8 a11 11 0 0 1 22 0 v8" fill="none" stroke="#fb7185" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M2.5 24.5 h27" stroke="#34d399" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="12.5" y="14.5" width="7" height="7" rx="1.4" class="ink"/>
  </g>
  <text class="wm name" x="112" y="60">KnowledgePorter</text>
  <text class="wm tag"  x="114" y="92">reviewed before it is remembered</text>
</svg>
