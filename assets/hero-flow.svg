<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 436" width="1080" height="436"
     role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif">
<title id="t">How knowledge moves through doublegate</title>
<desc id="d">An agent writes a claim. It is held in a separate store nothing can read, scanned for
injection and secrets, graded and signed by a reviewer that did not write it, reviewed again by a
second gate on its own authority, and only then readable company-wide. Once signed it is visible to
the author's own agents immediately, while others wait for that signature. Rejected content returns
to holding with its reasons. Records such as transcripts and logs bypass review entirely.</desc>
<defs>
  <style><![CDATA[
    .zn   { font-size:11.5px; font-weight:700; letter-spacing:.1em; fill:#8d97a9; }
    .st   { font-size:12px; font-weight:700; letter-spacing:.07em; }
    .nm   { font-size:14px; font-weight:600; fill:#e6e9ef; }
    .sb   { font-size:12.5px; fill:#97a1b2; }
    .panel{ fill:#0e1118; stroke:#1e2430; stroke-width:1.4; }
    @media (prefers-reduced-motion: reduce) { .mover { display: none; } }
  ]]></style>
  <linearGradient id="gHold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4c0519" stop-opacity=".6"/><stop offset="1" stop-color="#4c0519" stop-opacity=".15"/>
  </linearGradient>
  <linearGradient id="gChk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#78350f" stop-opacity=".6"/><stop offset="1" stop-color="#78350f" stop-opacity=".15"/>
  </linearGradient>
  <linearGradient id="gOk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#064e3b" stop-opacity=".65"/><stop offset="1" stop-color="#064e3b" stop-opacity=".18"/>
  </linearGradient>
  <linearGradient id="gLed" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4c1d95" stop-opacity=".65"/><stop offset="1" stop-color="#4c1d95" stop-opacity=".18"/>
  </linearGradient>
  <linearGradient id="gCyn" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0e7490" stop-opacity=".5"/><stop offset="1" stop-color="#0e7490" stop-opacity=".14"/>
  </linearGradient>
  <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fb7185" stop-opacity=".55"/>
    <stop offset=".3" stop-color="#fbbf24" stop-opacity=".55"/>
    <stop offset=".55" stop-color="#34d399" stop-opacity=".55"/>
    <stop offset=".78" stop-color="#a78bfa" stop-opacity=".55"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="railV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fb7185" stop-opacity=".55"/>
    <stop offset=".3" stop-color="#fbbf24" stop-opacity=".55"/>
    <stop offset=".55" stop-color="#34d399" stop-opacity=".55"/>
    <stop offset=".78" stop-color="#a78bfa" stop-opacity=".55"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity=".55"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <path id="mRail" d="M 74 240 L 981 240" fill="none"/>
  <path id="mMine" d="M 614.5 128 L 614.5 108" fill="none"/>
  <path id="mRej" d="M 614.5 240 L 614.5 260 Q 614.5 270 604.5 270 L 238 270 Q 228 270 228 260 L 228 240" fill="none"/>
  <path id="mRec" d="M 74 352 L 981 352" fill="none"/>
</defs>
<rect width="1080" height="436" fill="#08090c"/>
<text class="zn" x="24" y="30">CLAIMS — WHAT THE AGENT ASSERTS AS TRUE</text>
<path d="M 74 240 L 981 240" stroke="url(#rail)" stroke-width="2.5" fill="none"/>
<g>
  <rect class="panel" x="24" y="154" width="100" height="62" rx="12"/>
  <text class="nm" x="74" y="180" text-anchor="middle">an agent</text>
  <text class="nm" x="74" y="198" text-anchor="middle">writes it</text>
  <line x1="74" y1="216" x2="74" y2="240" stroke="#232b39" stroke-width="1.5"/>
  <circle cx="74" cy="240" r="4" fill="#0e1118" stroke="#8d97a9" stroke-width="1.5"/>
</g>
<g>
  <rect x="148" y="138" width="160" height="78" rx="13" fill="url(#gHold)" stroke="#fb7185" stroke-width="1.6"/>
  <text class="st" x="228" y="164" text-anchor="middle" fill="#fb7185">HELD</text>
  <text class="nm" x="228" y="186" text-anchor="middle">a separate store</text>
  <text class="sb" x="228" y="204" text-anchor="middle">no read path to it</text>
  <line x1="228" y1="216" x2="228" y2="240" stroke="#fb718566" stroke-width="1.5"/>
  <circle cx="228" cy="240" r="4.5" fill="#08090c" stroke="#fb7185" stroke-width="2"/>
</g>
<g>
  <rect x="332" y="138" width="171" height="78" rx="13" fill="url(#gChk)" stroke="#fbbf24" stroke-width="1.6"/>
  <text class="st" x="417.5" y="164" text-anchor="middle" fill="#fbbf24">SCANNED</text>
  <text class="nm" x="417.5" y="186" text-anchor="middle">injection · secrets</text>
  <text class="sb" x="417.5" y="204" text-anchor="middle">executable payloads</text>
  <line x1="417.5" y1="216" x2="417.5" y2="240" stroke="#fbbf2466" stroke-width="1.5"/>
  <circle cx="417.5" cy="240" r="4.5" fill="#08090c" stroke="#fbbf24" stroke-width="2"/>
</g>
<g>
  <rect x="527" y="128" width="175" height="88" rx="14" fill="url(#gOk)" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
  <text class="st" x="614.5" y="154" text-anchor="middle" fill="#34d399">GRADED &amp; SIGNED</text>
  <text class="nm" x="614.5" y="176" text-anchor="middle">by a reviewer who</text>
  <text class="nm" x="614.5" y="194" text-anchor="middle">did not write it</text>
  <line x1="614.5" y1="216" x2="614.5" y2="240" stroke="#34d39966" stroke-width="1.5"/>
  <circle cx="614.5" cy="240" r="5" fill="#08090c" stroke="#34d399" stroke-width="2.2"/>
</g>
<g>
  <rect x="726" y="138" width="156" height="78" rx="13" fill="url(#gLed)" stroke="#a78bfa" stroke-width="1.6"/>
  <text class="st" x="804" y="164" text-anchor="middle" fill="#a78bfa">SECOND GATE</text>
  <text class="nm" x="804" y="186" text-anchor="middle">reviewed again,</text>
  <text class="sb" x="804" y="204" text-anchor="middle">on its own authority</text>
  <line x1="804" y1="216" x2="804" y2="240" stroke="#a78bfa66" stroke-width="1.5"/>
  <circle cx="804" cy="240" r="4.5" fill="#08090c" stroke="#a78bfa" stroke-width="2"/>
</g>
<g>
  <rect x="906" y="138" width="150" height="78" rx="13" fill="url(#gCyn)" stroke="#22d3ee" stroke-width="1.6"/>
  <text class="st" x="981" y="164" text-anchor="middle" fill="#22d3ee">READABLE</text>
  <text class="nm" x="981" y="186" text-anchor="middle">company-wide,</text>
  <text class="nm" x="981" y="204" text-anchor="middle">pre-approved</text>
  <line x1="981" y1="216" x2="981" y2="240" stroke="#22d3ee66" stroke-width="1.5"/>
  <circle cx="981" cy="240" r="4.5" fill="#08090c" stroke="#22d3ee" stroke-width="2"/>
</g>
<!-- author fast lane: ONE straight vertical from the top edge of the signing
     box to its callout, on the box centre line. Nothing to route around, and
     no part of it crosses a box interior. -->
<path d="M 614.5 128 L 614.5 108" stroke="#34d399" stroke-opacity=".5" stroke-width="1.6" stroke-dasharray="4 4" fill="none"/>
<g>
  <rect class="panel" x="474" y="58" width="280" height="46" rx="11" stroke="#34d399" stroke-opacity=".45"/>
  <text class="nm" x="614.5" y="78" text-anchor="middle">visible to you straight away</text>
  <text class="sb" x="614.5" y="95" text-anchor="middle">others wait for the signature, you do not</text>
</g>
<!-- rejection: junction to junction, three straight runs, own band -->
<path d="M 614.5 240 L 614.5 260 Q 614.5 270 604.5 270 L 238 270 Q 228 270 228 260 L 228 240" stroke="#fb7185" stroke-opacity=".45" stroke-width="1.6" stroke-dasharray="4 4" fill="none"/>
<text class="sb" x="24" y="294" fill="#fb7185" fill-opacity=".85">a failed verdict sends it back to holding, with its reasons — it can be re-earned</text>
<line x1="24" y1="312" x2="1056" y2="312" stroke="#1b212c" stroke-width="1"/>
<text class="zn" x="24" y="334">RECORDS — WHAT ACTUALLY HAPPENED</text>
<path d="M 74 352 L 981 352" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
<circle cx="60" cy="352" r="4" fill="#0e1118" stroke="#60a5fa" stroke-width="1.5"/>
<circle cx="995" cy="352" r="4" fill="#0e1118" stroke="#60a5fa" stroke-width="1.5"/>
<text class="nm" x="540" y="376" text-anchor="middle" fill="#93c5fd">transcripts · tool output · logs — straight through, never held</text>
<text class="sb" x="540" y="394" text-anchor="middle">they record what happened; they do not claim anything is true</text>
<text x="540" y="422" text-anchor="middle" font-size="14.5" font-weight="600" fill="#e6e9ef">All the checking happens on the way in — nothing sits in the read path.</text>
<!-- dots ride the rail; every track is a line-only band -->
<g class="mover" fill="#fb7185"><circle r="5.5">
  <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"><mpath href="#mRail"/></animateMotion>
  <animate attributeName="fill" dur="8s" repeatCount="indefinite"
    values="#8d97a9;#fb7185;#fbbf24;#34d399;#a78bfa;#22d3ee;#22d3ee"
    keyTimes="0;0.15;0.32;0.5;0.68;0.88;1"/>
  <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;1;0" keyTimes="0;0.04;0.5;0.94;1"/>
  <animate attributeName="r" dur="8s" repeatCount="indefinite" values="5.5;5.5;7;5.5;5.5" keyTimes="0;0.46;0.5;0.56;1"/>
</circle></g>
<g class="mover" fill="#fb7185"><circle r="5.5">
  <animateMotion dur="8s" begin="2.7s" repeatCount="indefinite" calcMode="linear"><mpath href="#mRail"/></animateMotion>
  <animate attributeName="fill" dur="8s" begin="2.7s" repeatCount="indefinite"
    values="#8d97a9;#fb7185;#fbbf24;#34d399;#a78bfa;#22d3ee;#22d3ee"
    keyTimes="0;0.15;0.32;0.5;0.68;0.88;1"/>
  <animate attributeName="opacity" dur="8s" begin="2.7s" repeatCount="indefinite" values="0;1;1;1;0" keyTimes="0;0.04;0.5;0.94;1"/>
  <animate attributeName="r" dur="8s" begin="2.7s" repeatCount="indefinite" values="5.5;5.5;7;5.5;5.5" keyTimes="0;0.46;0.5;0.56;1"/>
</circle></g>
<g class="mover" fill="#fb7185"><circle r="5.5">
  <animateMotion dur="8s" begin="5.4s" repeatCount="indefinite" calcMode="linear"><mpath href="#mRail"/></animateMotion>
  <animate attributeName="fill" dur="8s" begin="5.4s" repeatCount="indefinite"
    values="#8d97a9;#fb7185;#fbbf24;#34d399;#a78bfa;#22d3ee;#22d3ee"
    keyTimes="0;0.15;0.32;0.5;0.68;0.88;1"/>
  <animate attributeName="opacity" dur="8s" begin="5.4s" repeatCount="indefinite" values="0;1;1;1;0" keyTimes="0;0.04;0.5;0.94;1"/>
  <animate attributeName="r" dur="8s" begin="5.4s" repeatCount="indefinite" values="5.5;5.5;7;5.5;5.5" keyTimes="0;0.46;0.5;0.56;1"/>
</circle></g>
<g class="mover" fill="#34d399"><circle r="4.5">
  <animateMotion dur="8s" begin="4.1s" repeatCount="indefinite" calcMode="linear"><mpath href="#mMine"/></animateMotion>
  <animate attributeName="opacity" dur="8s" begin="4.1s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.06;0.3;0.42;1"/>
</circle></g>
<g class="mover" fill="#fb7185"><circle r="4.5">
  <animateMotion dur="16s" begin="3.6s" repeatCount="indefinite" calcMode="linear"><mpath href="#mRej"/></animateMotion>
  <animate attributeName="opacity" dur="16s" begin="3.6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.2;0.27;1"/>
</circle></g>
<g class="mover" fill="#60a5fa"><circle r="4">
  <animateMotion dur="4.4s" repeatCount="indefinite" calcMode="linear"><mpath href="#mRec"/></animateMotion>
  <animate attributeName="opacity" dur="4.4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.05;0.9;1"/>
</circle></g>
<g class="mover" fill="#60a5fa"><circle r="4">
  <animateMotion dur="4.4s" begin="1.5s" repeatCount="indefinite" calcMode="linear"><mpath href="#mRec"/></animateMotion>
  <animate attributeName="opacity" dur="4.4s" begin="1.5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.05;0.9;1"/>
</circle></g>
<g class="mover" fill="#60a5fa"><circle r="4">
  <animateMotion dur="4.4s" begin="2.9s" repeatCount="indefinite" calcMode="linear"><mpath href="#mRec"/></animateMotion>
  <animate attributeName="opacity" dur="4.4s" begin="2.9s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.05;0.9;1"/>
</circle></g>
<rect class="mover" x="527" y="128" width="175" height="88" rx="14" fill="none" stroke="#34d399" stroke-width="2">
  <animate attributeName="stroke-opacity" dur="8s" repeatCount="indefinite" values="0;0;.85;0;0" keyTimes="0;0.44;0.5;0.6;1"/>
  <animate attributeName="stroke-width" dur="8s" repeatCount="indefinite" values="2;2;4.5;2;2" keyTimes="0;0.44;0.5;0.6;1"/>
</rect>
</svg>
