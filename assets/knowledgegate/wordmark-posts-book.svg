<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 120" width="760" height="120" role="img" aria-label="KnowledgeGate — reviewed before it is remembered">
  <title>KnowledgeGate</title>
  <desc>A closed book held between two gates: admission, then ratification.</desc>
  <style>
    .wm { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif; }
    .name { font-size: 54px; font-weight: 650; letter-spacing: -1.2px; fill: #e6e9ef; }
    .tag  { font-size: 20px; fill: #97a1b2; }
    .ink { fill: #e6e9ef; }
    .cut { stroke: #08090c; }
    @media (prefers-color-scheme: light) {
      .name { fill: #10131a; }
      .tag  { fill: #55606f; }
      .ink { fill: #10131a; }
      .cut { stroke: #ffffff; }
    }
  </style>
  <g transform="translate(14 12) scale(2.0)">
    <path d="M4.5 5 v22" stroke="#fb7185" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M27.5 5 v22" stroke="#34d399" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M11 10.5 h10 a2 2 0 0 1 2 2 v7 a2 2 0 0 1 -2 2 h-10 a2 2 0 0 1 -2 -2 v-7 a2 2 0 0 1 2 -2 z" class="ink"/>
    <path d="M16 10.5 v11" class="cut" stroke-width="2.2" fill="none"/>
  </g>
  <text class="wm name" x="112" y="60">KnowledgeGate</text>
  <text class="wm tag"  x="114" y="92">reviewed before it is remembered</text>
</svg>
