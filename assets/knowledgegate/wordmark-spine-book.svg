<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 120" width="760" height="120" role="img" aria-label="KnowledgeGate — reviewed before it is remembered">
  <title>KnowledgeGate</title>
  <desc>A book whose spine is the gate; the first line inside is the signed one.</desc>
  <style>
    .wm { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif; }
    .name { font-size: 54px; font-weight: 650; letter-spacing: -1.2px; fill: #e6e9ef; }
    .tag  { font-size: 20px; fill: #97a1b2; }
    .ink { fill: #e6e9ef; }
    .cut { stroke: #08090c; }
    @media (prefers-color-scheme: light) {
      .name { fill: #10131a; }
      .tag  { fill: #55606f; }
      .ink { fill: #10131a; }
      .cut { stroke: #ffffff; }
    }
  </style>
  <g transform="translate(14 12) scale(2.0)">
    <path d="M7.5 6 h14 a3.5 3.5 0 0 1 3.5 3.5 v13 a3.5 3.5 0 0 1 -3.5 3.5 h-14 z" fill="none" stroke="#fb7185" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M7.5 6 v20" stroke="#fb7185" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M12.5 12.5 h8.5" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <path d="M12.5 19.5 h5.5" stroke="#97a1b2" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="wm name" x="112" y="60">KnowledgeGate</text>
  <text class="wm tag"  x="114" y="92">reviewed before it is remembered</text>
</svg>
