    <path d="M22 20 l7 -9" stroke="#34d399" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="13.5" y="13.5" width="6" height="6" rx="1.4" fill="#fbbf24" transform="rotate(-12 16.5 16.5)"/>
    <path d="M2.5 27.5 h27" stroke="#97a1b2" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  </g>
  <text class="wm name" x="112" y="60">doublegate</text>
