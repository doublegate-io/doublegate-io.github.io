<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" width="720" height="120" role="img" aria-label="doublegate — reviewed before it is remembered">
  <title>doublegate</title>
  <desc>doublegate — knockout, displaced sideways only — not the duplicate-icon diagonal.</desc>
  <style>
    .wm { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif; }
    .name { font-size: 54px; font-weight: 650; letter-spacing: -1.2px; fill: #e6e9ef; }
    .tag { font-size: 20px; fill: #97a1b2; }
    .ink { fill: #e6e9ef; }
    .ink-s { stroke: #e6e9ef; }
    .cut { stroke: #08090c; }
    .acc { stroke: #34d399; }
    @media (prefers-color-scheme: light) {
      .name { fill: #10131a; }
      .tag { fill: #55606f; }
      .ink { fill: #10131a; }
      .ink-s { stroke: #10131a; }
      .cut { stroke: #ffffff; }
      .acc { stroke: #059669; }
    }
  </style>
  <g transform="translate(14 12) scale(2.0)">
    <path d="M3 7 h17 v18 h-17 z" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M12 7 v18" fill="none" class="cut" stroke-width="4.5"/>
    <path d="M12 7 h17 v18 h-17 z" fill="none" class="ink-s" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <text class="wm name" x="112" y="60">doublegate</text>
  <text class="wm tag"  x="114" y="92">reviewed before it is remembered</text>
</svg>
