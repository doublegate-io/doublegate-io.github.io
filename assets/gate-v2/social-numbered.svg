    <path d="M 22 27 v3" stroke="#34d399" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 27 27 v3" stroke="#34d399" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <text class="wm name" x="96" y="360">doublegate</text>
  <text class="wm tag"  x="100" y="424">reviewed before it is remembered</text>
