  <title>doublegate</title>
  <desc>doublegate — order by tally — one stroke, then two.</desc>
  <style>
    .wm { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif; }
    .name { font-size: 104px; font-weight: 680; letter-spacing: -3px; fill: #e6e9ef; }
    .tag { font-size: 38px; fill: #b6bfcd; }
    .dom { font-size: 27px; fill: #97a1b2; letter-spacing: 0.5px; }
    .ink { fill: #e6e9ef; }
    .ink-s { stroke: #e6e9ef; }
  </style>
  <rect width="1200" height="630" fill="#08090c"/>
  <rect x="0" y="0" width="1200" height="5" fill="#34d399"/>
  <g transform="translate(96 150) scale(4.1)">
