<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="doublegate">
  <title>doublegate</title>
  <desc>Two entries in a register: held, then admitted. The second record sits over the first.</desc>
